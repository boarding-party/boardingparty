apiVersion: v1
kind: ServiceAccount
metadata:
  name: bp-director
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bp-director
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
rules:
  - apiGroups: ["agents.tinysystems.io"]
    resources: ["sessions"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # What tiny's pkg/session needs to materialise a session's workload.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get"]
  # The one-run gate also waits for run pods to be gone.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bp-director
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bp-director
subjects:
  - kind: ServiceAccount
    name: bp-director
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bp-director-data
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bp-director
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
spec:
  replicas: 1
  strategy:
    type: Recreate # one writer on the SQLite PVC
  selector:
    matchLabels:
      app: bp-director
  template:
    metadata:
      labels:
        app: bp-director
    spec:
      serviceAccountName: bp-director
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: director
          image: ghcr.io/boarding-party/director:main
          imagePullPolicy: Always
          args:
            - --data=/data
            - --worker-image=ghcr.io/boarding-party/worker:main
            - --director-url=http://bp-director.$(POD_NAMESPACE).svc:8080
            - --admin-addr=127.0.0.1:8081
            - --worker-addr=:8080
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Admin API bearer secret; created by `boardingparty setup` before this Deployment.
            - name: BP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bp-director-admin
                  key: token
          ports:
            - name: worker
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: worker
          livenessProbe:
            httpGet:
              path: /healthz
              port: worker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bp-director-data
---
apiVersion: v1
kind: Service
metadata:
  name: bp-director
  labels:
    app.kubernetes.io/managed-by: boardingparty
    app.kubernetes.io/name: bp-director
spec:
  type: ClusterIP
  selector:
    app: bp-director
  ports:
    - name: worker
      port: 8080
      targetPort: worker
